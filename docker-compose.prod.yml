version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: erp_mongo_prod
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - erp_network

  server:
    image: ${DOCKERHUB_USERNAME}/university-erp-server:latest
    container_name: erp_server_prod
    restart: always
    env_file: ./server/.env
    depends_on:
      - mongo
    networks:
      - erp_network

  client:
    image: ${DOCKERHUB_USERNAME}/university-erp-client:latest
    container_name: erp_client_prod
    restart: always
    networks:
      - erp_network

  nginx:
    image: nginx:alpine
    container_name: erp_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

volumes:
  mongo_data:
