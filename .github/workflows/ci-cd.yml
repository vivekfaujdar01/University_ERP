name: University ERP CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: Lint & Type Check ─────────────────────────────────────────────────
  test-and-lint:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        run: cd server && npm ci

      - name: Lint Server
        run: cd server && npm run lint

      - name: Type Check Server
        run: cd server && npm run type-check

      - name: Run Server Tests
        run: cd server && npm test

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Lint Client
        run: cd client && npm run lint

      - name: Type Check Client
        run: cd client && npm run type-check

  # ─── Job 2: Build & Push Docker Images ────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/university-erp-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/university-erp-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/university-erp-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/university-erp-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Deploy to EC2 ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/university-erp
            docker compose -f docker-compose.prod.yml pull || docker-compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-deps || docker-compose -f docker-compose.prod.yml up -d --no-deps
            docker system prune -f

      - name: Health Check
        run: |
          sleep 20
          curl --fail http://${{ secrets.EC2_HOST }}/api/v1/health || exit 1

      - name: Notify Success
        if: success()
        run: |
          curl -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{"text":"✅ University ERP deployed successfully to EC2 — commit ${{ github.sha }}"}'

      - name: Notify Failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{"text":"❌ University ERP deployment FAILED — commit ${{ github.sha }}"}'
