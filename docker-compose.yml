version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: erp_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - erp_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: erp_server
    ports:
      - "5000:5000"
    env_file: ./server/.env
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - erp_network
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: erp_client
    ports:
      - "3000:3000"
    env_file: ./client/.env
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - erp_network
    command: npm run dev -- --host

volumes:
  mongo_data:

networks:
  erp_network:
    driver: bridge
